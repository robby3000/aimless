name: Ring sync

# Fetches each registered site's aimless/ring.json and merges its walks
# into public/ring/ring.json. Commits only on change; the push then
# deploys the new registry via pages.yml. The stamp does not move (ring/
# is excluded), so installed phones get no update toast.
on:
  schedule:
    - cron: '23 6 * * *'   # daily, off the hour
  workflow_dispatch:

permissions:
  contents: write   # commit the updated registry
  issues: write     # the audit-report issue on each change
  actions: write    # dispatch pages.yml - a GITHUB_TOKEN push can't trigger workflows

concurrency:
  group: ring-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ring-sync.mjs
        env:
          # GITHUB_TOKEN is a secret, not an exported env var - without this
          # the script takes its "no token" path and skips the report issue.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the registry if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain public/ring/ring.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/ring/ring.json
            git commit -m "ring: sync members from site manifests"
            git push
            # A GITHUB_TOKEN push cannot trigger other workflows, so the
            # Pages deploy is dispatched explicitly or the registry never ships.
            gh workflow run pages.yml --ref main
          else
            echo "no changes"
          fi
