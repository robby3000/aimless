<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Aimless webring</title>
<meta name="description" content="Published Aimless walks, chained: previous, random and next.">
<link rel="icon" href="../icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="../icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
:root {
  --bg: #23221f; --surface: #161616; --fg: #e8e8e8; --fg-dim: #888; --accent: #7ab8ff; --rule: #3d3c36;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  line-height: 1.6; padding: 24px; max-width: 640px; margin: 0 auto;
  min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
}
h1 { font-size: 1.4rem; margin-bottom: 4px; }
.kicker { font-family: monospace; color: var(--accent); font-size: 0.9rem; margin-bottom: 20px; }
.dim { color: var(--fg-dim); }
a { color: var(--accent); }
.member { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.member .title { font-family: monospace; text-decoration: none; }
.member .meta { color: var(--fg-dim); font-size: 0.85rem; }
.howto { margin-top: 28px; font-size: 0.9rem; }
footer { margin-top: 40px; color: var(--fg-dim); font-size: 0.8rem; text-align: center; }
footer a { color: inherit; }
footer .policy { margin-bottom: 14px; text-align: left; }
</style>
</head>
<body>
  <h1>The Aimless webring</h1>
  <div class="kicker" id="ring-status">&hellip;</div>
  <div id="ring-body" class="dim">Reading the registry.</div>
  <noscript>
    <p>The ring needs JavaScript to walk on. <a href="https://aimless.earth">Aimless</a> is a walking app with no map.</p>
  </noscript>
  <footer>
    <p class="policy">A hand-kept chain: every site is added by the maintainer, and every walk is its maker's own page on their own site. A site or a walk can be removed at any time - report one to <a href="mailto:contact@aimless.earth">contact@aimless.earth</a>.</p>
    Made by <a href="https://aimless.earth">Aimless</a>. Go Nowhere, Somewhere.
  </footer>
<script type="module">
  import { resolveRing } from '../lib/ring.js';

  const status = document.getElementById('ring-status');
  const body = document.getElementById('ring-body');
  const params = new URLSearchParams(location.search);
  const from = params.get('from') || '';
  const dir = params.get('dir') || '';

  function memberLine(m) {
    const div = document.createElement('div');
    div.className = 'member';
    const a = document.createElement('a');
    a.className = 'title';
    a.href = m.url;
    a.textContent = m.title;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${m.date} · ${m.site}`;
    div.append(a, meta);
    return div;
  }

  function howto() {
    const p = document.createElement('p');
    p.className = 'howto';
    const a = document.createElement('a');
    a.href = 'https://aimless.earth';
    a.textContent = 'Aimless';
    p.append('Made with ', a, '? Publish a walk, tick "Add to the Aimless webring", and your page joins the chain.');
    return p;
  }

  try {
    const registry = await fetch('./ring.json', { cache: 'no-store' }).then((r) => r.json());
    const res = resolveRing(registry, { from, dir }, Math.random);

    if (res.kind === 'redirect') {
      status.textContent = 'walking on';
      body.textContent = res.url;
      location.replace(res.url);
    } else if (res.kind === 'pending') {
      status.textContent = 'finding its place';
      const p = document.createElement('p');
      p.textContent = 'This walk is not in the ring yet. It may be waiting for its site to join, or for the next turn of the wheel.';
      const hop = resolveRing(registry, { dir: 'random' }, Math.random);
      const link = document.createElement('a');
      link.href = hop.kind === 'redirect' ? hop.url : 'https://aimless.earth';
      link.textContent = 'Visit a random walk';
      body.replaceChildren(p, link);
    } else if (res.kind === 'empty') {
      status.textContent = 'still forming';
      body.textContent = 'The ring is still forming. No walks have joined it yet.';
    } else {
      const n = registry.members.length;
      status.textContent = `${n} walk${n === 1 ? '' : 's'} in the ring`;
      // Members are stored newest-last by join order.
      body.replaceChildren(...registry.members.map(memberLine), howto());
      body.classList.remove('dim');
    }
  } catch {
    status.textContent = 'lost the thread';
    body.textContent = 'The registry could not be read. Try again in a moment.';
  }
</script>
</body>
</html>
